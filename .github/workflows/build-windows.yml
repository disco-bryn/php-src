name: Build Native PHP 7.4.5 Windows Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually via the UI

jobs:
  build:
    runs-on: windows-2019 # Automatically provides the VC15 / VS2017 toolchain natively

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up PHP SDK & Build Tools
      run: |
        # Use PowerShell to install the official headless Windows build modules
        Install-Module -Name BuildPhp -Repository PSGallery -Force -AllowClobber

    - name: Compile PHP 7.4.5 Binary
      shell: powershell
      run: |
        # Triggers the headless compile using the cloud's pre-licensed compiler tools
        Invoke-PhpBuild -Arch x64 -Ts ts

    - name: Upload Compiled Windows Binary
      uses: actions/artifacts@v4
      with:
        name: php-7.4.5-windows-custom
        path: artifacts/ # Grabs the resulting build folder containing your raw .exe
