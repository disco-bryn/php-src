name: Build Custom Thread-Safe PHP for Apache

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger via the GitHub Actions dashboard

jobs:
  build:
    runs-on: windows-2022 # Upgraded to modern Windows runner

    steps:
      - name: Checkout Custom PHP Branch
        uses: actions/checkout@v4
        with:
          ref: PHP-7.4-CVE-2026-109618-109619
          fetch-depth: 0

      - name: Verify Checked-Out Source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nCurrent branch:"
          git branch --show-current

          Write-Host "`nCurrent commit:"
          git rev-parse HEAD

          Write-Host "`nLatest commit:"
          git log -1 --oneline

          Write-Host "`nGit status:"
          git status

          Write-Host "`nRepository contents:"
          Get-ChildItem

      - name: Inject Legacy VS2017 VC15 Build Tools
        shell: powershell
        run: |
          # Explicitly adds the required MSVC v141 build components to the windows-2022 image
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (Test-Path $installer) {
              Write-Host "Installing VC15 compiler components..."
              Start-Process $installer -ArgumentList "modify --id Microsoft.VisualStudio.Workload.MSBuild --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --quiet --norestart" -Wait
          } else {
              Write-Error "Visual Studio Installer path could not be found."
          }

      - name: Install BuildPhp Module
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Install-Module BuildPhp `
            -Repository PSGallery `
            -Force `
            -AllowClobber

          Import-Module BuildPhp

          Get-Command Invoke-PhpBuild -ErrorAction Stop

      - name: Show Build Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Working directory:"
          Get-Location

          Write-Host "Git commit being built:"
          git log -1 --oneline

          Get-ChildItem

      - name: Build PHP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module BuildPhp

          Invoke-PhpBuild `
            -Arch x64 `
            -Ts ts

      - name: Locate Build Output
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse |
            Sort-Object FullName

      - name: Upload Apache-Compatible Binary Zip
        uses: actions/upload-artifact@v4
        with:
          name: php-7.4-custom-apache-x64
          path: artifacts/
